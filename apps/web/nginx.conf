server {
  listen 8080;
  server_name fossilfinneren.no test.fossilfinneren.no;
  root /usr/share/nginx/html;
  index index.html;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;

  # Every host the app talks to at runtime. Schools need the same list in their content filter.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.fossilfinneren.no https://plausible.io; style-src 'self' https://cdn.fossilfinneren.no; img-src 'self' data: blob: https://cdn.fossilfinneren.no https://innhold.fossilfinneren.no https://api.fossilfinneren.no https://cache.kartverket.no; media-src https://video.fossilfinneren.no; connect-src 'self' https://api.fossilfinneren.no https://auth.dataporten.no https://api.dataporten.no https://groups-api.dataporten.no https://plausible.io; font-src 'self' https://cdn.fossilfinneren.no; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://auth.dataporten.no" always;

  location / {
    try_files $uri /index.html;
  }

  # The Feide redirect URI is handled by the React app.
  location = /auth/callback {
    try_files /index.html =404;
  }
}
